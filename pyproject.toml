[project]
name = "bugtrack-pro"
version = "0.3.0"
description = "A project-based issue tracker, rebuilt one milestone at a time."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "email-validator>=2.2,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0.43,<2.1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx2", "pytest>=8.4,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
